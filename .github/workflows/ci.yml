name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Both hooks' only failure mode is silence: a guard that stops guarding looks exactly
  # like a clean run. Nothing else exercises them, so this job is the whole safety net.
  #
  # ubuntu deliberately, not macos. The Stop hook reverses the transcript with
  # `tail -r 2>/dev/null || tac`, and Darwin has `tail -r` while Linux has only `tac` —
  # so the `tac` branch is unreachable on a developer's Mac and CI is the only place it
  # ever runs.
  hooks:
    name: Hook self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop-hook self-test
        run: bash hooks/block-false-stop.sh --self-test

      - name: Branch-guard self-test
        run: bash hooks/protect-plan-branch.sh --self-test

      # Every check below lives in scripts/ci/ so it runs identically here and locally
      # (scripts/ci/all.sh). Each script's header says what it catches.
      - name: Hooks are wired, and every command exists and is executable
        run: bash scripts/ci/hooks-wired.sh

      - name: Self-tests accept the hook path as an argument
        run: bash scripts/ci/hooks-relocatable.sh

  script-tests:
    name: Script self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each fixture declares its exact error and warning counts, and each readback case
      # its count of lines Jira lost, so a check that stops firing fails here instead of
      # passing every draft it was meant to stop.
      - name: Linter fixtures produce their declared counts
        run: python3 skills/write-tickets/scripts/lint_draft.py --self-test

      # One case per way an approval could count when it should not, and per reviewer-set
      # edge; ship-pr and ci-green call this script rather than re-deriving the rules.
      - name: Review gate self-test
        run: python3 skills/ci-green/scripts/review_gate.py --self-test

      # Each README fixture declares the exact error and warning codes it must produce, and
      # the same run checks the skill's files, frontmatter, and that it and its vendored
      # parser use the 3.8 grammar and import only the standard library.
      - name: README checker fixtures
        run: python3 skills/readme-docs/scripts/check_readme.py --self-test

      # One case per way a scan finding could pass the commit or push gate when it should
      # block; both gates call this script rather than reading SARIF by hand.
      - name: SARIF gate self-test
        run: python3 gates/scripts/sarif_gate.py --self-test

  manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every JSON file parses
        run: bash scripts/ci/json-parses.sh

      - name: Frontmatter names match their paths
        run: bash scripts/ci/frontmatter-names.sh

      - name: Line budget
        run: bash scripts/ci/line-budget.sh

      - name: Bundled-file references resolve
        run: bash scripts/ci/bundled-refs.sh

      - name: No project-specific tokens leaked into shared files
        run: bash scripts/ci/no-leaks.sh

      - name: Every CI step has a local equivalent
        run: bash scripts/ci/ci-steps-mirrored.sh

      - name: CI scripts pass shellcheck
        run: bash scripts/ci/shellcheck.sh

      # A check whose only failure mode is silence looks like a clean run. This proves
      # each one still fails on the defect it exists to catch.
      - name: CI checks fail on the defects they exist to catch
        run: bash scripts/ci/self-test.sh

  # The one check to require in branch protection. It waits on every job and fails if any
  # failed or was cancelled; `if: always()` keeps it from being skipped, which GitHub
  # counts as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [hooks, script-tests, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci/all-jobs-passed.sh
