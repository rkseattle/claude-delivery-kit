# Keeps every SHA-pinned action current: Dependabot opens a PR moving each pin and its
# version comment to the newest release, as GitHub's security hardening guide pairs
# pinning with updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before its PR, so a compromised tag is likelier caught first,
    # as zizmor's dependabot-cooldown audit asks.
    cooldown:
      default-days: 7
